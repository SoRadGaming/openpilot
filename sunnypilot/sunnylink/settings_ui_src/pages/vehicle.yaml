# Page: vehicle (per-brand settings)
# Compiles to settings_ui.json#vehicle_settings (brand = section id).
id: vehicle
label: Vehicle
icon: vehicle
order: 99
kind: vehicle
sections:
- id: honda
  title: Honda Settings
  description: ''
  items:
  - key: HondaDynamicTuningEnabled
    widget: toggle
    needs_onroad_cycle: true
    title: Dynamic Longitudinal Learning (Alpha)
    description: Learn this car's throttle and brake response while you drive, and correct for it.
      Also compensates the accel target for road grade. Honda Nidec with sunnypilot longitudinal
      only; has no effect on other platforms. Learned values are saved roughly once a minute and
      reloaded on the next drive.
    details: The car reads this toggle once when it goes onroad, so a change only takes effect at
      the next ignition - set it, then key off and on. What it has learned so far is on the read-only
      rows below.
    enablement:
    - $ref: '#/macros/offroad'
  - key: HondaDynamicPcmBlendEnabled
    widget: toggle
    needs_onroad_cycle: true
    title: '...also blend the PCM gas above 30 km/h (Experimental)'
    description: Additionally hand part of the throttle request back to the car's own cruise computer
      above 30 km/h, where the gas pedal interceptor loses authority. This changes which actuator
      drives the car and is not yet validated on a drive - leave it off unless you are actively
      testing it.
    enablement:
    - $ref: '#/macros/offroad'
    - type: param
      key: HondaDynamicTuningEnabled
      equals: true
  - key: HondaDynPedalGain0
    widget: info
    blocked: true
    title: Learned pedal gain at 0 km/h
    description: 1.00 means the stock pedal request was right; 1.30 means this car needs 30% more
      pedal than stock asked for at that speed.
  - key: HondaDynPedalGain1
    widget: info
    blocked: true
    title: Learned pedal gain at 11 km/h
  - key: HondaDynPedalGain2
    widget: info
    blocked: true
    title: Learned pedal gain at 22 km/h
  - key: HondaDynPedalGain3
    widget: info
    blocked: true
    title: Learned pedal gain at 36 km/h
  - key: HondaDynPedalGain4
    widget: info
    blocked: true
    title: Learned pedal gain at 54 km/h
  - key: HondaDynPedalGain5
    widget: info
    blocked: true
    title: Learned pedal gain at 72 km/h
  - key: HondaDynBrakeGain
    widget: info
    blocked: true
    title: Learned brake gain
    description: 0.00 until it has learned anything. Positive adds brake, negative trims it.
  - key: HondaDynWindFactor
    widget: info
    blocked: true
    title: Learned aero factor
- id: hyundai
  title: Hyundai / Kia / Genesis Settings
  description: ''
  items:
  - key: HyundaiLongitudinalTuning
    widget: multiple_button
    title: Custom Longitudinal Tuning
    options:
    - value: 0
      label: 'Off'
    - value: 1
      label: Dynamic
    - value: 2
      label: Predictive
    visibility:
    - type: capability
      field: hyundai_alpha_long_available
      equals: true
    enablement:
    - $ref: '#/macros/offroad'
    - $ref: '#/macros/longitudinal'
- id: subaru
  title: Subaru Settings
  description: ''
  items:
  - key: SubaruStopAndGo
    widget: toggle
    title: Stop and Go (Beta)
    enablement:
    - $ref: '#/macros/offroad'
    - type: capability
      field: has_stop_and_go
      equals: true
  - key: SubaruStopAndGoManualParkingBrake
    widget: toggle
    title: Stop and Go for Manual Parking Brake (Beta)
    enablement:
    - $ref: '#/macros/offroad'
    - type: capability
      field: has_stop_and_go
      equals: true
- id: tesla
  title: Tesla Settings
  description: ''
  items:
  - key: TeslaCoopSteering
    widget: toggle
    title: Cooperative Steering (Beta)
    enablement:
    - $ref: '#/macros/offroad'
- id: toyota
  title: Toyota / Lexus Settings
  description: ''
  items:
  - key: ToyotaEnforceStockLongitudinal
    widget: toggle
    needs_onroad_cycle: true
    title: Enforce Factory Longitudinal Control
    description: sunnypilot will not take over control of gas and brakes. Factory Toyota longitudinal control will be used.
    enablement:
    - $ref: '#/macros/not_engaged'
  - key: ToyotaStopAndGoHack
    widget: toggle
    needs_onroad_cycle: true
    title: Stop and Go Hack (Alpha)
    description: sunnypilot will allow some Toyota/Lexus cars to auto resume during stop and go traffic. This feature is only
      applicable to certain models that are able to use longitudinal control. This is an alpha feature. Use at your own risk.
    enablement:
    - $ref: '#/macros/not_engaged'
    - $ref: '#/macros/longitudinal'
    - type: param
      key: ToyotaEnforceStockLongitudinal
      equals: false
