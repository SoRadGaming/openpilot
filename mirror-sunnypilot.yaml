name: mirror sunnypilot

# Lives in SoRadGaming/openpilot, on the DEFAULT branch (master).
# Replaces update-sunnypilot.ps1 / .bat.
#
# Watches SoRadGaming/sunnypilot@master and republishes it here as the
# `sunnypilot` branch, so the self-hosted installer URL always serves the
# latest code:
#
#     install.soradgaming.com/fork/SoRadGaming/sunnypilot
#
# NO CREDENTIALS. Reading sunnypilot needs no auth (it is public), and the push
# is to THIS repo, so the automatic GITHUB_TOKEN covers it. Nothing to create,
# nothing to rotate, nothing to expire.
#
# Only LFS POINTERS move. The binaries live on sunnypilot's public GitLab LFS
# (.lfsconfig -> gitlab.com/sunnypilot/public/sunnypilot-new-lfs), and .lfsconfig
# travels with the branch content, so the comma device fetches them from GitLab
# at install time regardless of which GitHub repo served the branch. Nothing here
# ever talks to GitLab: no SSH keys, and none of the ~421 MB of binaries moves.
#
# WHY IT IS SAFE ON master: the force-push only ever touches refs/heads/sunnypilot.
# This repo's master (where this file lives) is a separate branch and is never
# written by this workflow. The target branch is a pure mirror, never hand-edited,
# which is why --force is correct and why there is never anything to merge.

on:
  schedule:
    # every 15 min. GitHub queues scheduled runs and often fires them late, so
    # treat this as "within ~15-30 min", not exact. Use the Run workflow button
    # when you want it now.
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      source_branch:
        description: "branch of SoRadGaming/sunnypilot to mirror"
        required: false
        default: master

permissions:
  contents: write        # push refs/heads/sunnypilot to this repo

concurrency:
  group: mirror-sunnypilot
  cancel-in-progress: true

env:
  SOURCE_URL: https://github.com/SoRadGaming/sunnypilot.git
  TARGET_BRANCH: sunnypilot

  # Pointers only. SKIP_PUSH stops the pre-push hook trying to upload binaries;
  # SKIP_SMUDGE is belt-and-braces (we never check out a work tree anyway).
  GIT_LFS_SKIP_SMUDGE: 1
  GIT_LFS_SKIP_PUSH: 1

jobs:
  mirror:
    name: republish sunnypilot@master as this repo's sunnypilot branch
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Two ls-remote calls, ~1 second, no clone. On a 15-minute cron the vast
      # majority of runs stop here, so we only pay the ~99 MB fetch when there
      # is genuinely something new.
      - name: Check whether the mirror is already current
        id: check
        run: |
          set -euo pipefail

          SOURCE_BRANCH="${{ github.event.inputs.source_branch || 'master' }}"
          TARGET_URL="https://github.com/${GITHUB_REPOSITORY}.git"

          SRC="$(git ls-remote "$SOURCE_URL" "refs/heads/${SOURCE_BRANCH}" | cut -f1)"
          if [ -z "$SRC" ]; then
            echo "::error::branch '${SOURCE_BRANCH}' not found in ${SOURCE_URL}"
            exit 1
          fi

          # may legitimately be empty the very first time
          DST="$(git ls-remote "$TARGET_URL" "refs/heads/${TARGET_BRANCH}" | cut -f1 || true)"

          echo "source ${SOURCE_BRANCH} = $SRC"
          echo "target ${TARGET_BRANCH} = ${DST:-<does not exist yet>}"

          {
            echo "source_branch=$SOURCE_BRANCH"
            echo "src=$SRC"
            echo "dst=$DST"
            if [ "$SRC" = "$DST" ]; then echo "changed=false"; else echo "changed=true"; fi
          } >> "$GITHUB_OUTPUT"

      - name: Fetch and republish
        if: steps.check.outputs.changed == 'true'
        run: |
          set -euo pipefail

          SRC="${{ steps.check.outputs.src }}"
          SOURCE_BRANCH="${{ steps.check.outputs.source_branch }}"
          TARGET_URL="https://github.com/${GITHUB_REPOSITORY}.git"

          # Bare-ish scratch repo: no work tree, so LFS smudge never runs and no
          # binary is ever materialised.
          git init -q --bare mirror.git
          cd mirror.git

          echo "==> fetching ${SOURCE_BRANCH} from sunnypilot (pointers only)"
          git fetch --no-tags --quiet "$SOURCE_URL" "refs/heads/${SOURCE_BRANCH}:refs/heads/${TARGET_BRANCH}"

          # Send the token as a header rather than in the URL, and via `git -c`
          # so it is never written into config. Actions masks the raw secret but
          # not its base64, so mask that too.
          AUTH="$(printf 'x-access-token:%s' "${{ github.token }}" | base64 -w0)"
          echo "::add-mask::$AUTH"

          echo "==> force-pushing to ${TARGET_BRANCH}"
          git -c http.extraheader="AUTHORIZATION: basic ${AUTH}" \
            push --force "$TARGET_URL" "refs/heads/${TARGET_BRANCH}:refs/heads/${TARGET_BRANCH}"

          # Verify rather than trust the exit code.
          NOW="$(git ls-remote "$TARGET_URL" "refs/heads/${TARGET_BRANCH}" | cut -f1)"
          if [ "$NOW" != "$SRC" ]; then
            echo "::error::verification failed: ${TARGET_BRANCH} is $NOW, expected $SRC"
            exit 1
          fi
          echo "==> verified at $NOW"

      - name: Summary
        if: always()
        run: |
          {
            if [ "${{ steps.check.outputs.changed }}" = "true" ]; then
              echo "### Mirrored"
            else
              echo "### Already up to date"
            fi
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| source | \`SoRadGaming/sunnypilot@${{ steps.check.outputs.source_branch }}\` |"
            echo "| commit | \`${{ steps.check.outputs.src }}\` |"
            echo "| target | \`${{ github.repository }}\` branch \`${TARGET_BRANCH}\` |"
            echo
            echo "Install URL: \`install.soradgaming.com/fork/SoRadGaming/${TARGET_BRANCH}\`"
          } >> "$GITHUB_STEP_SUMMARY"
