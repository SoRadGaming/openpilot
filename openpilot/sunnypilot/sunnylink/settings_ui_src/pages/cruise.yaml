# Page: cruise
# Edit this file. Run compile_settings_ui.py to emit settings_ui.json.
id: cruise
label: Cruise
icon: cruise_control
order: 2
remote_configurable: true
description: Longitudinal control, speed limits, and cruise behavior
sections:
- id: core_cruise_features
  title: ''
  description: ''
  items:
  - key: ExperimentalMode
    widget: toggle
    title: Experimental Mode
    enablement:
    - $ref: '#/macros/longitudinal'
  - key: DynamicExperimentalControl
    widget: toggle
    title: Dynamic Experimental Control
    description: Let the model decide when to use sunnypilot ACC or sunnypilot End to End Longitudinal.
    visibility:
    - $ref: '#/macros/longitudinal'
    enablement:
    - $ref: '#/macros/longitudinal'
  - key: DisengageOnAccelerator
    widget: toggle
    title: Disengage Cruise on Accelerator Pedal
    description: When enabled, pressing the accelerator pedal will disengage longitudinal control.
  - key: LongitudinalPersonality
    widget: multiple_button
    title: Driving Personality
    description: Standard is recommended. In aggressive mode, sunnypilot will follow lead cars closer and be more aggressive
      with the gas and brake. In relaxed mode sunnypilot will stay further away from lead cars. On supported cars, you can
      cycle through these personalities with your steering wheel distance button.
    options:
    - value: 0
      label: Aggressive
    - value: 1
      label: Standard
    - value: 2
      label: Relaxed
    enablement:
    - $ref: '#/macros/longitudinal'
  - key: IntelligentCruiseButtonManagement
    widget: toggle
    title: Intelligent Cruise Button Management (ICBM) (Alpha)
    visibility:
    - type: capability
      field: icbm_available
      equals: true
    enablement:
    - $ref: '#/macros/offroad'
    - type: not
      condition:
        type: capability
        field: has_longitudinal_control
        equals: true
- id: custom_acc_increments
  title: Custom ACC Speed Intervals
  description: ''
  enablement:
  - $ref: '#/macros/offroad'
  - type: any
    conditions:
    - type: all
      conditions:
      - type: capability
        field: has_longitudinal_control
        equals: true
      - type: not
        condition:
          type: capability
          field: pcm_cruise
          equals: true
    - type: capability
      field: has_icbm
      equals: true
  items:
  - key: CustomAccIncrementsEnabled
    widget: toggle
    title: Enable Custom ACC Speed Intervals
    enablement:
    - $ref: '#/macros/offroad'
    - type: any
      conditions:
      - type: all
        conditions:
        - type: capability
          field: has_longitudinal_control
          equals: true
        - type: not
          condition:
            type: capability
            field: pcm_cruise
            equals: true
      - type: capability
        field: has_icbm
        equals: true
  sub_panels:
  - id: custom_acc_intervals
    label: Custom ACC Speed Intervals Settings
    trigger_key: CustomAccIncrementsEnabled
    trigger_condition:
      type: param
      key: CustomAccIncrementsEnabled
      equals: true
    items:
    - key: CustomAccShortPressIncrement
      widget: option
      title: Short Press Increment
      min: 1
      max: 10
      step: 1
      enablement:
      - type: param
        key: CustomAccIncrementsEnabled
        equals: true
    - key: CustomAccLongPressIncrement
      widget: option
      title: Long Press Increment
      min: 1
      max: 10
      step: 1
      enablement:
      - type: param
        key: CustomAccIncrementsEnabled
        equals: true
- id: speed_limits
  title: Speed Limits
  description: Speed limit detection and offset behavior
  items: []
  sub_panels:
  - id: speed_limit_settings
    label: Speed Limit Settings
    trigger_key: SpeedLimitMode
    items:
    - key: SpeedLimitMode
      widget: multiple_button
      title: Speed Limit Assist Mode
      options:
      - value: 0
        label: 'Off'
      - value: 1
        label: Information
      - value: 2
        label: Warning
      - value: 3
        label: Assist
        enablement:
        - type: any
          conditions:
          - type: capability
            field: has_longitudinal_control
            equals: true
          - type: capability
            field: has_icbm
            equals: true
        - type: not
          condition:
            type: capability
            field: brand
            equals: rivian
        - type: not
          condition:
            type: all
            conditions:
            - type: capability
              field: brand
              equals: tesla
            - type: capability
              field: is_sp_release
              equals: true
    - key: SpeedLimitPolicy
      widget: multiple_button
      title: Speed Limit Source
      options:
      - value: 0
        label: Car State Only
      - value: 1
        label: Map Data Only
      - value: 2
        label: Car State Priority
      - value: 3
        label: Map Data Priority
      - value: 4
        label: Combined
    # FORK(SPEED-LIMIT): SpeedLimitMapStrict, default on. Off is upstream's behavior.
    - key: SpeedLimitMapStrict
      widget: toggle
      title: Strict Map Speed Limits
      description: Prompt only for a new speed limit, not when the limit disappears or the same one returns. On a road
        the map has no limit for, forget the previous road's map limit after 10 seconds instead of keeping it for the
        rest of the drive. While GPS is lost (tunnels), keep the limit you entered with instead of the streets overhead,
        until the map has found the road again, and do not prompt for it when engaging.
    # FORK(NSW-ZONES): SpeedLimitNswZones, default 2 (live). Off is upstream's behavior.
    - key: SpeedLimitNswZones
      widget: multiple_button
      title: NSW Speed Zones
      description: In New South Wales, take the map speed limit from Transport for NSW's speed zones and school zones
        instead of OpenStreetMap, and keep it through tunnels by following the tunnel's zones. OSM is used where NSW
        has no zone. Log Only records what NSW would say without using it. Turning it on from Off takes effect after
        the next reboot. Contains data from Transport for NSW (Speed Zones, School Zones), licensed CC BY 4.0.
        Modified. Not endorsed by Transport for NSW.
      options:
      - value: 0
        label: 'Off'
      - value: 1
        label: Log Only
      - value: 2
        label: Live
    - key: NswZonesAutoUpdate
      widget: toggle
      title: Update NSW Speed Zones Weekly
      description: Check for new NSW speed zone data once a week, only while parked on wi-fi that is not marked
        metered. The first download (about 22 MB) happens by itself.
      visibility:
      - type: param_compare
        key: SpeedLimitNswZones
        op: '>'
        value: 0
    # FORK(NSW-ZONES): the maps page's two update buttons and the OSM weekly toggle. The "Now" items are toggles, not
    # the schema's `button` widget: nothing in this tree defines what the app does for a `button`, and a toggle is
    # known to write the BOOL param. mapd_manager clears the param once it has taken the request - or refused it,
    # onroad - without bumping ParamsVersion, so the switch reads off again only the next time the app loads the
    # settings. Dimmed with the mode off, like NswZonesAutoUpdate: a download for a feature that is off.
    - key: NswZonesUpdateCheck
      widget: toggle
      title: Update NSW Speed Zones Now
      description: Check for new NSW speed zone data now, on any network (about 22 MB when there is new data). Works
        whenever the device is offroad, Always Offroad with the car on included; a request while driving is refused.
        The device switches it back off within a second, taken or refused; the app shows that the next time it loads
        the settings. After that, switching it on again asks again.
      visibility:
      - type: param_compare
        key: SpeedLimitNswZones
        op: '>'
        value: 0
      enablement:
      - $ref: '#/macros/offroad'
    - key: OsmAutoUpdateWeekly
      widget: toggle
      title: Update OSM Maps Weekly
      description: Download the chosen region's OpenStreetMap data again once it is a week old, only while parked on
        wi-fi that is not marked metered. A phone hotspot counts as wi-fi unless it is marked metered.
    - key: OsmDbUpdatesCheck
      widget: toggle
      title: Update OSM Maps Now
      description: Download the chosen region's OpenStreetMap data again now (Australia is about 270 MB), on whatever
        network the device is on, cellular included. Works whenever the device is offroad, Always Offroad with the car
        on included, and a region has been chosen; a request while driving is refused. Driving off does not stop a
        download that has started. Keep the device on until it finishes. The device switches it back off within a
        second, taken or refused; the app shows that the next time it loads the settings.
      enablement:
      - $ref: '#/macros/offroad'
    - key: SpeedLimitOffsetType
      widget: multiple_button
      title: Speed Limit Offset Type
      options:
      - value: 0
        label: 'Off'
      - value: 1
        label: Fixed
      - value: 2
        label: Percentage
    - key: SpeedLimitValueOffset
      widget: option
      title: Speed Limit Offset Value
      min: -30
      max: 30
      step: 1
      unit:
        metric: km/h
        imperial: mph
      visibility:
      - type: param_compare
        key: SpeedLimitOffsetType
        op: '>'
        value: 0
- id: smart_cruise
  title: Smart Cruise Control
  description: ''
  enablement:
  - type: any
    conditions:
    - type: capability
      field: has_longitudinal_control
      equals: true
    - type: capability
      field: has_icbm
      equals: true
  items:
  - key: SmartCruiseControlVision
    widget: toggle
    title: Vision
    description: Use vision path predictions to estimate the appropriate speed to drive through turns ahead.
    visibility:
    - type: any
      conditions:
      - type: capability
        field: has_longitudinal_control
        equals: true
      - type: capability
        field: has_icbm
        equals: true
    enablement:
    - type: any
      conditions:
      - type: capability
        field: has_longitudinal_control
        equals: true
      - type: capability
        field: has_icbm
        equals: true
  - key: SmartCruiseControlMap
    widget: toggle
    title: Map
    description: Use map data to estimate the appropriate speed to drive through turns ahead.
    visibility:
    - type: any
      conditions:
      - type: capability
        field: has_longitudinal_control
        equals: true
      - type: capability
        field: has_icbm
        equals: true
    enablement:
    - type: any
      conditions:
      - type: capability
        field: has_longitudinal_control
        equals: true
      - type: capability
        field: has_icbm
        equals: true
- id: honda_dynamic_learning
  title: Honda Nidec Dynamic Learning
  description: What the dynamic longitudinal tuner has learned and counted on this car. Read-only --
    the toggles are on the Vehicle page.
  # Lives on a PAGE rather than in the honda vehicle section on purpose. The only info
  # row the dashboard demonstrably renders is LanguageSetting, which is in a page; no
  # brand's vehicle section has ever carried one, and these did not draw there.
  visibility:
  - type: capability
    field: brand
    equals: honda
  items:
  - key: HondaDynBrakeGain
    widget: info
    title: Learned brake gain
    description: 0.00 until it has learned anything. Positive adds brake, negative trims it.
  - key: HondaDynModeSecD
    widget: info
    title: Engaged seconds in D
    description: Time driven with sunnypilot longitudinal engaged in each drive mode, saved once a
      minute. Per-mode pedal tables need about 15 minutes each of ECON and S.
  - key: HondaDynModeSecECON
    widget: info
    title: Engaged seconds in ECON
  - key: HondaDynModeSecS
    widget: info
    title: Engaged seconds in S
