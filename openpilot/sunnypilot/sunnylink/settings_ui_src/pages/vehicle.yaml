# Page: vehicle (per-brand settings)
# Compiles to settings_ui.json#vehicle_settings (brand = section id).
id: vehicle
label: Vehicle
icon: vehicle
order: 99
kind: vehicle
sections:
- id: honda
  title: Honda Settings
  description: ''
  items:
  - key: HondaDynamicTuningEnabled
    widget: toggle
    needs_onroad_cycle: true
    title: Dynamic Longitudinal Learning (Alpha)
    description: Learn this car's throttle and brake response while you drive, and correct for it.
      Also compensates the accel target for road grade. Honda Nidec with sunnypilot longitudinal
      only; has no effect on other platforms. Learned values are saved roughly once a minute and
      reloaded on the next drive.
    details: The car reads this toggle once when it goes onroad, so a change only takes effect at
      the next ignition - set it, then key off and on. What it has learned so far is on the read-only
      rows below.
    enablement:
    - $ref: '#/macros/offroad'
  # FORK(BRAKE-LAMP-TEST): labels must match CANDIDATES in
  # opendbc/sunnypilot/car/honda/brake_lamp_test.py (selfdrive/ui/tests/test_brake_lamp_test_settings.py
  # checks it).
  - key: HondaBrakeLampTest
    widget: option
    title: Brake Lamp Test (HONDA_ACCORD_9G_AU only)
    description: Test mode for the Accord 9G AU only; every other car ignores it. Sets one extra bit in openpilot's
      own brake (0x1FA) or HUD (0x30C) frame, only once openpilot has held the car at a standstill for 1 s with no
      pedal pressed, to see whether any bit lights the stop lamps. Applies at one stop per setting and is cleared
      at the end of the drive. Entries 9-17 are CMBS-adjacent unknowns - stop at the first cluster warning, set
      Off and restart the car before continuing.
    details: The car re-reads this every 0.2 s, so it works onroad. Nothing else changes - the stock ACC
      stand-down, SCM_BUTTONS and CMBS are untouched. Every change and the resulting frame are written to the
      route log. To repeat an entry at another stop, pick a different entry and then the same one again.
    options:
    - value: 0
      label: 'Off'
    - value: 1
      label: 1FA bit 23
    - value: 2
      label: 1FA bit 22
    - value: 3
      label: 1FA bits 21+22
    - value: 4
      label: 1FA bits 21+23
    - value: 5
      label: 1FA bits 22+23
    - value: 6
      label: 1FA bits 21-23
    - value: 7
      label: 1FA bit 21
    - value: 8
      label: 30C bit 42
    - value: 9
      label: 30C bit 38
    - value: 10
      label: 1FA bit 44
    - value: 11
      label: 1FA bit 32
    - value: 12
      label: 1FA bit 33
    - value: 13
      label: 1FA bit 34
    - value: 14
      label: 1FA bit 35
    - value: 15
      label: 1FA bit 36
    - value: 16
      label: 1FA bit 37
    - value: 17
      label: 1FA bit 38
    visibility:
    - $ref: '#/macros/longitudinal'
- id: hyundai
  title: Hyundai / Kia / Genesis Settings
  description: ''
  items:
  - key: HyundaiLongitudinalTuning
    widget: multiple_button
    title: Custom Longitudinal Tuning
    options:
    - value: 0
      label: 'Off'
    - value: 1
      label: Dynamic
    - value: 2
      label: Predictive
    visibility:
    - type: capability
      field: hyundai_alpha_long_available
      equals: true
    enablement:
    - $ref: '#/macros/offroad'
    - $ref: '#/macros/longitudinal'
- id: subaru
  title: Subaru Settings
  description: ''
  items:
  - key: SubaruStopAndGo
    widget: toggle
    title: Stop and Go (Beta)
    enablement:
    - $ref: '#/macros/offroad'
    - type: capability
      field: has_stop_and_go
      equals: true
  - key: SubaruStopAndGoManualParkingBrake
    widget: toggle
    title: Stop and Go for Manual Parking Brake (Beta)
    enablement:
    - $ref: '#/macros/offroad'
    - type: capability
      field: has_stop_and_go
      equals: true
- id: tesla
  title: Tesla Settings
  description: ''
  items:
  - key: TeslaCoopSteering
    widget: toggle
    title: Cooperative Steering (Beta)
    enablement:
    - $ref: '#/macros/offroad'
  - key: TeslaMadsScreenButton
    widget: multiple_button
    title: MADS Screen Activation
    description: 'Use a multi-finger press on the infotainment screen to toggle MADS.
      This allows the use of full MADS functionality when enabled. Selecting a higher
      finger count may reduce accidental activations. Note: Setting this to Off will
      reset your MADS settings to default.'
    options:
    - value: 0
      label: 'Off'
    - value: 1
      label: 3-Finger
    - value: 2
      label: 4-Finger
    - value: 3
      label: 5-Finger
    visibility:
    - type: capability
      field: tesla_has_vehicle_bus
      equals: true
    enablement:
    - $ref: '#/macros/offroad'
- id: toyota
  title: Toyota / Lexus Settings
  description: ''
  items:
  - key: ToyotaEnforceStockLongitudinal
    widget: toggle
    needs_onroad_cycle: true
    title: Enforce Factory Longitudinal Control
    description: sunnypilot will not take over control of gas and brakes. Factory Toyota longitudinal control will be used.
    enablement:
    - $ref: '#/macros/not_engaged'
  - key: ToyotaStopAndGoHack
    widget: toggle
    needs_onroad_cycle: true
    title: Stop and Go Hack (Alpha)
    description: sunnypilot will allow some Toyota/Lexus cars to auto resume during stop and go traffic. This feature is only
      applicable to certain models that are able to use longitudinal control. This is an alpha feature. Use at your own risk.
    enablement:
    - $ref: '#/macros/not_engaged'
    - $ref: '#/macros/longitudinal'
    - type: param
      key: ToyotaEnforceStockLongitudinal
      equals: false
