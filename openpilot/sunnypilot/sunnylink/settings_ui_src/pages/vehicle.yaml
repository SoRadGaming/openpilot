# Page: vehicle (per-brand settings)
# Compiles to settings_ui.json#vehicle_settings (brand = section id).
id: vehicle
label: Vehicle
icon: vehicle
order: 99
kind: vehicle
sections:
- id: honda
  title: Honda Settings
  description: ''
  items:
  # FORK(HONDA_ELESYS): the dynamic tuner's toggle (its description lost the pedal and aero learners
  # in 2026-10 and gained the drive-mode counting), and the gas-law setting below it.
  - key: HondaDynamicTuningEnabled
    widget: toggle
    needs_onroad_cycle: true
    title: Dynamic Longitudinal Learning (Alpha)
    description: Learn this car's brake response while you drive, and correct for it. Also
      compensates the accel target for road grade, and counts driving time in each drive mode (D,
      ECON, S). Honda Nidec with sunnypilot longitudinal only; has no effect on other platforms.
      Learned values are saved roughly once a minute and reloaded on the next drive.
    details: The car reads this toggle once when it goes onroad, so a change only takes effect at
      the next ignition - set it, then key off and on. What it has learned so far is on the read-only
      rows on the Cruise page.
    enablement:
    - $ref: '#/macros/offroad'
  # FORK(HONDA_ELESYS): HondaElesysGasLawV2, read once at ignition by elesys_gas.py.
  - key: HondaElesysGasLawV2
    widget: toggle
    needs_onroad_cycle: true
    title: Measured Gas Pedal Law (2013-15 Accord)
    description: 'On: the comma pedal follows the throttle response measured on this car. It asks
      for less pedal per m/s^2 above 11 km/h - most at 20-70 km/h, where the old law over-delivered
      (the lunge, then sag, pulling away from a roll) - and holds a lower cruise pedal above 60 km/h.
      Below 11 km/h it is the old law exactly, and the hand-over between gas and brake is unchanged
      below 60 km/h. Off: the previous law. 2013-15 Accord (Elesys) only. Applies at the next drive.'
    details: Applies at the next drive - the car reads it once when it goes onroad. Expect gentler
      onset at 20-70 km/h; sunnypilot's own controller adds whatever is really missing. The law runs
      with Dynamic Longitudinal Learning on or off, but the engaged time per drive mode (what future
      ECON and S tables will be fitted from) is only counted while that toggle is on.
    enablement:
    - $ref: '#/macros/offroad'
  # FORK(LEAD-BRAKE): LeadBrakeAssistMode, read once when plannerd starts (lead_brake_assist.py), so offroad only.
  # 0 off, 1 shadow (the default), 2 live. The owner's only switch: there is no SSH to the car.
  - key: LeadBrakeAssistMode
    widget: multiple_button
    needs_onroad_cycle: true
    title: Brake Sooner for a Hard-Braking Car
    description: Live - when the car ahead brakes hard, openpilot starts braking a little sooner (about 0.2 s). It reads
      the fall in that car's radar speed before the radar's own smoothed estimate catches up, once the camera also sees
      the car slowing or the fall shows on two radar readings in a row. Shadow works out what it would do and logs it
      for review, changing nothing. Off - nothing runs. 2013-15 Accord (Elesys) with sunnypilot longitudinal only.
      Applies at the next drive.
    details: Shadow is the default. The brake itself is unchanged - this only starts it earlier - and nothing here acts
      on a car the radar sees standing still, on a car beyond 60 m, or without the radar.
    options:
    - value: 0
      label: 'Off'
    - value: 1
      label: Shadow
    - value: 2
      label: Live
    enablement:
    - $ref: '#/macros/offroad'
  # FORK(HONDA_ACCORD_9G_AU): HondaElesysStockAcc, stock ACC mode, read once at ignition (opendbc _initialize_honda).
  # Offroad only, and never the 'longitudinal' macro: has_longitudinal_control goes false in this mode, which would
  # lock the toggle on.
  - key: HondaElesysStockAcc
    widget: toggle
    needs_onroad_cycle: true
    title: Stock ACC (testing)
    description: The car's own cruise control does gas and brake; openpilot steers only. Takes effect at the next car
      start. Stock ACC works above about 30 km/h. openpilot cannot cancel stock ACC - use the car's CANCEL button or the
      brake. CMBS is unaffected. 2013-15 Accord (Elesys) only.
    details: Every frame passes between the car and the radar, so the factory ACC and CMBS work as on a car without a
      comma; openpilot keeps steering through the LKAS board. Experimental Mode, Dynamic Experimental Control, custom
      ACC increments, Smart Cruise Control and Speed Limit Assist need openpilot longitudinal and are unavailable in
      this mode; they come back as they were at the first drive after it is turned off.
    enablement:
    - $ref: '#/macros/offroad'
  # FORK(HONDA_ACCORD_9G_AU): HondaElesysPumpC1b, read once at ignition (opendbc _initialize_honda), openpilot
  # longitudinal only. Offroad only, and not the 'longitudinal' macro, like stock ACC.
  - key: HondaElesysPumpC1b
    widget: toggle
    needs_onroad_cycle: true
    title: Quiet pump at stops
    description: On - the brake pump runs like the previous rule while braking, from the first moment of every
      application, and stays silent through long stops - no top-ups once a stop is held. Off - the previous pump rule,
      which also tops a held stop up every 30 s. sunnypilot longitudinal on the 2013-15 Accord (Elesys) only. Applies
      at the next drive.
    details: The pump builds brake pressure; measured on this car, a rise in braking arrives only while it runs, and a
      steady brake or a built standstill hold keeps without it. On, every brake application gets a short burst at its
      first moment and every further rise past a small deadband one more, at once; firm braking (over 200 counts) above
      9 km/h and braking over 100 counts while creeping into a stop below 9 km/h run it continuously, and braking at
      100 counts or more while moving runs it at least every 6 s. While stopped it runs only to build the hold, or to
      deliver a rise of more than 15 counts (the soft stop's rise to the full hold) - never to top a hold up. It
      replaces "Quieter brake pump", which was quieter while moving, and starts on whatever that setting was. Turn it
      off to go back to the previous rule if a stop ever falls short or a hold creeps.
    enablement:
    - $ref: '#/macros/offroad'
- id: hyundai
  title: Hyundai / Kia / Genesis Settings
  description: ''
  items:
  - key: HyundaiLongitudinalTuning
    widget: multiple_button
    title: Custom Longitudinal Tuning
    options:
    - value: 0
      label: 'Off'
    - value: 1
      label: Dynamic
    - value: 2
      label: Predictive
    visibility:
    - type: capability
      field: hyundai_alpha_long_available
      equals: true
    enablement:
    - $ref: '#/macros/offroad'
    - $ref: '#/macros/longitudinal'
- id: subaru
  title: Subaru Settings
  description: ''
  items:
  - key: SubaruStopAndGo
    widget: toggle
    title: Stop and Go (Beta)
    enablement:
    - $ref: '#/macros/offroad'
    - type: capability
      field: has_stop_and_go
      equals: true
  - key: SubaruStopAndGoManualParkingBrake
    widget: toggle
    title: Stop and Go for Manual Parking Brake (Beta)
    enablement:
    - $ref: '#/macros/offroad'
    - type: capability
      field: has_stop_and_go
      equals: true
- id: tesla
  title: Tesla Settings
  description: ''
  items:
  - key: TeslaCoopSteering
    widget: toggle
    title: Cooperative Steering (Beta)
    enablement:
    - $ref: '#/macros/offroad'
  - key: TeslaMadsScreenButton
    widget: multiple_button
    title: MADS Screen Activation
    description: 'Use a multi-finger press on the infotainment screen to toggle MADS.
      This allows the use of full MADS functionality when enabled. Selecting a higher
      finger count may reduce accidental activations. Note: Setting this to Off will
      reset your MADS settings to default.'
    options:
    - value: 0
      label: 'Off'
    - value: 1
      label: 3-Finger
    - value: 2
      label: 4-Finger
    - value: 3
      label: 5-Finger
    visibility:
    - type: capability
      field: tesla_has_vehicle_bus
      equals: true
    enablement:
    - $ref: '#/macros/offroad'
- id: toyota
  title: Toyota / Lexus Settings
  description: ''
  items:
  - key: ToyotaEnforceStockLongitudinal
    widget: toggle
    needs_onroad_cycle: true
    title: Enforce Factory Longitudinal Control
    description: sunnypilot will not take over control of gas and brakes. Factory Toyota longitudinal control will be used.
    enablement:
    - $ref: '#/macros/not_engaged'
  - key: ToyotaStopAndGoHack
    widget: toggle
    needs_onroad_cycle: true
    title: Stop and Go Hack (Alpha)
    description: sunnypilot will allow some Toyota/Lexus cars to auto resume during stop and go traffic. This feature is only
      applicable to certain models that are able to use longitudinal control. This is an alpha feature. Use at your own risk.
    enablement:
    - $ref: '#/macros/not_engaged'
    - $ref: '#/macros/longitudinal'
    - type: param
      key: ToyotaEnforceStockLongitudinal
      equals: false
