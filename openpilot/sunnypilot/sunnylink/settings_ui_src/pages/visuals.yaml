# Page: visuals
# Edit this file. Run compile_settings_ui.py to emit settings_ui.json.
id: visuals
label: Visuals
icon: visuals
order: 4
remote_configurable: true
description: HUD overlays, alerts, and on-screen display elements
sections:
- id: hud_elements
  title: HUD Elements
  description: Overlays shown on the driving screen
  items:
  - key: BlindSpot
    widget: toggle
    title: Show Blind Spot Warnings
    description: Enabling this will display warnings when a vehicle is detected in your blind spot as long as your car has
      BSM supported.
  - key: TorqueBar
    widget: toggle
    title: Steering Arc
    description: Display steering arc on the driving screen when lateral control is enabled.
  - key: ShowTurnSignals
    widget: toggle
    title: Display Turn Signals
    description: When enabled, visual turn indicators are drawn on the HUD.
  - key: RoadNameToggle
    widget: toggle
    title: Display Road Name
    description: Displays the name of the road the car is traveling on. The OpenStreetMap database of the location must be
      downloaded to fetch the road name.
    visibility:
    - $ref: '#/macros/hide_on_mici'
  - key: StandstillTimer
    widget: toggle
    title: Standstill Timer
    description: Show a timer on the HUD when the car is at a standstill.
    visibility:
    - $ref: '#/macros/hide_on_mici'
  - key: RocketFuel
    widget: toggle
    title: Real-time Acceleration Bar
    description: Show an indicator on the left side of the screen to display real-time vehicle acceleration and deceleration.
      This displays what the car is currently doing, not what the planner is requesting.
    visibility:
    - $ref: '#/macros/hide_on_mici'
  - key: ChevronInfo
    widget: option
    title: Display Metrics Below Chevron
    options:
    - value: 0
      label: 'Off'
    - value: 1
      label: Distance
    - value: 2
      label: Speed
    - value: 3
      label: Time
    - value: 4
      label: All
    visibility:
    - $ref: '#/macros/hide_on_mici'
    enablement:
    - $ref: '#/macros/longitudinal'
# FORK(HUD): the comma 4's stop timer, the coming limit, the alert changes (compact banners, the confirm in MAX's place)
# and the right strip's planned stop and curve (selfdrive/ui/sunnypilot/mici/onroad/hud_*.py). Shown for a comma 4 only:
# nothing else draws them. Every item off gives exactly the stock comma 4 screen.
- id: hud_comma4
  title: HUD
  description: The comma 4 driving screen - the stop timer, the coming speed limit, smaller alerts, and the planned
    stop or curve in the right strip. Changes show within a second.
  visibility:
  - type: capability
    field: device_type
    equals: mici
  items:
  - key: HudStoppedTimer
    widget: toggle
    title: Stop Timer
    description: After a second at a standstill, a stopwatch and how long you have been stopped, top right.
      While engaged, a stop raises the 'take control' prompt, which covers the screen - and the stopwatch - unless
      Compact Take Control Banner When Stopped is on.
  - key: HudStoppedBanner
    widget: toggle
    title: Compact Take Control Banner When Stopped
    description: At a standstill the 'take control, resume driving manually' prompt is a small banner top left
      instead of covering the screen. It goes back to full screen when the car ahead moves off, until you drive
      away; the next stop starts small again.
  - key: HudApproachingLimit
    widget: toggle
    title: Approaching Limit
    description: A coming speed limit change - lower or higher - top left, where MAX shows the set speed, once it is
      within 15 seconds or 500 m - the new limit, an arrow down or up, 'in 300 m' and a bar that tracks the distance
      ('now' close in), drawn in the Limit Change Style below. It stays until the new limit is in force, then the
      confirm prompt or MAX takes the same place. It waits while MAX or any alert is showing, and the driver-monitoring
      face makes way for it, as it does for MAX. Never while stopped, never for a car-sourced limit, and never in a
      tunnel, where the map only guesses the position. Needs Speed Limit not Off.
  - key: HudLimitStyle
    widget: option
    title: Limit Change Style
    description: How the coming limit and the confirm prompt look, top left. Split Card - one black card, the MAX you
      are set to small on the left and the new limit big on the right, a red bar along its top filling as you get
      there; 'press - to set 100' under it, and once you press, the new number slides into MAX's place. Stock-plus - the
      new limit always where MAX is, on a see-through card with a draining bar while it is coming and a solid card as
      big as MAX with 'press - to set 100' when you need to press; once you press, the card dissolves into the usual
      MAX. Only the look changes, so it is fine to switch while driving.
    options:
    - value: 0
      label: Split Card
    - value: 1
      label: Stock-plus
  # FORK(NSW-CAMERAS): 'camera (map)' before a camera on the road ahead (hud_model.CameraState; customReserved12)
  - key: HudCameraAlerts
    widget: toggle
    title: Camera Alerts
    description: A small camera, how far it is and 'camera (map)' (or red-light cam, school cam) top left, right of
      where MAX shows, from about 400 m before a fixed speed, red-light or school-zone camera on the road you are on,
      in your direction. The locations come from OpenStreetMap in the NSW speed-zone data, updated weekly - they can be
      out of date or missing, so it says (map). Mobile and average-speed cameras are not shown. Display only - it never
      changes your speed, and there is no sound. Needs NSW Speed Zones on.
  - key: HudCompactLimitPrompts
    widget: toggle
    title: Compact Speed Limit Prompts
    description: '''Auto adjusting to speed limit'' and ''set speed changed'' no longer cover the road: the new set speed
      shows as MAX top left, as after any change. ''Press + (or -) to confirm'' shows the speed the confirm would set
      (the limit plus any offset) top left, where MAX is, with ''press - to set 100'' and the green key, and ''limit 50
      +5'' when there is an offset, in the Limit Change Style. Its outline flashes twice when it appears, then keeps
      moving until you press; once you press it turns into the usual MAX. With no limit to show it is a one-line
      banner. The sounds are unchanged.'
  - key: HudCompactDisengage
    widget: toggle
    title: Compact Disengage Notices
    description: '''Cruise off'' and ''lane centering off'', after you switch them off yourself, are a small banner top
      left instead of covering the screen. Anything openpilot ends by itself, every warning and every ''take control''
      still covers the screen.'
  - key: HudCompactTurn
    widget: toggle
    title: Compact Turn Notices
    description: '''Turning left'' and ''turning right'', while the blinker is on below lane-change speed, are a small
      banner top left instead of covering the screen.'
  - key: HudLaneBlock
    widget: toggle
    title: Lane Change Block Tile
    description: When a lane change is refused - a road edge or a car in the blind spot on the blinker's side - a small
      tile in that top corner, where the green lane-change arrow shows, instead of the orange alert over the road - the
      arrow struck through and EDGE or CAR under it. Silent; if you steer toward the blinker anyway, the tile flashes
      twice and chimes once. When the change is allowed, the tile gives way to the usual green arrow in the same place.
      The arrow over the wheel stays up while you wait. The refusal itself is unchanged.
  - key: HudPlannedStop
    widget: toggle
    title: Planned Stop
    description: Top of the right strip, above the confidence ball - an arrow onto a stop line and how far ahead
      the driving model plans to come to a stop, when that is within 10 seconds and there is no car ahead in the way.
      White while openpilot is driving your speed on that plan; grey with a dashed line when it is only the model's
      plan and openpilot is not braking for it. It never says why - a light, a sign or a queue look the same to it.
  - key: HudCurve
    widget: toggle
    title: Curve Speed
    description: Top of the right strip - a curve arrow and openpilot's target speed for the curve, in 5 km/h (5 mph)
      steps, while Smart Cruise Control is slowing the car for it. It goes as soon as you take over the speed. A
      planned stop takes the place first.
  # FORK(HUD): HudRadarDots (push13) - the radar's tracks as dots (radar_dots.py), the one HUD toggle that defaults off
  - key: HudRadarDots
    widget: toggle
    title: Radar Dots
    description: For checking the radar - a small dot on the road under everything the car's radar is tracking. White
      is a track openpilot is not following; cyan is the car it is following (a second, smaller cyan dot is the next
      car it watches); a cyan ring is something on the radar that openpilot holds its speed back for without
      following it as a car. A car only the camera sees has no dot. Off by default. It only draws; it changes nothing
      openpilot does. Also on the comma 4 under Settings > toggles.
- id: developer_ui
  title: Developer UI Info
  description: Speedometer and debug display options
  visibility:
  - $ref: '#/macros/hide_on_mici'
  items:
  - key: DevUIInfo
    widget: option
    title: Developer UI
    description: Display real-time parameters and metrics from various sources.
    options:
    - value: 0
      label: 'Off'
    - value: 1
      label: Bottom
    - value: 2
      label: Right
    - value: 3
      label: Right & Bottom
  - key: TrueVEgoUI
    widget: toggle
    title: 'Speedometer: Always Display True Speed'
    description: For applicable vehicles, always display the true vehicle current speed from wheel speed sensors.
  - key: HideVEgoUI
    widget: toggle
    title: 'Speedometer: Hide from Onroad Screen'
    description: When enabled, the speedometer on the onroad screen is not displayed.
- id: alerts_extras
  title: Alerts & Extras
  description: Traffic light alerts and visual flair
  items:
  - key: GreenLightAlert
    widget: toggle
    title: Green Traffic Light Alert (Beta)
    description: 'A chime and on-screen alert will play when the traffic light you are waiting for turns green and you have
      no vehicle in front of you. On-screen visual alert is only available on comma 3X. Note: This chime is only designed
      as a notification. It is the driver''s responsibility to observe their environment and make decisions accordingly.'
  - key: LeadDepartAlert
    widget: toggle
    title: Lead Departure Alert (Beta)
    description: 'A chime and on-screen alert will play when you are stopped, and the vehicle in front of you start moving.
      On-screen visual alert is only available on comma 3X. Note: This chime is only designed as a notification. It is the
      driver''s responsibility to observe their environment and make decisions accordingly.'
  - key: RainbowMode
    widget: toggle
    title: Tesla Rainbow Mode
    description: Display a rainbow effect on the path the model wants to take. It does not affect driving in any way.
